# GitHub Actions para compilar y desplegar APK de Flutter
# Inyecta automáticamente la Google Maps API Key desde los Secretos de GitHub

name: Build and Deploy Android

on:
  push:
    branches:
      - flutterflow

jobs:
  build-and-deploy-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # --- PASO CRÍTICO: INYECCIÓN DE API KEY ---
      - name: Inject Google Maps API Key
        env:
          MAPS_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          # Reemplaza el texto "MAPS_API_KEY_PLACEHOLDER" por el secreto real
          # Se aplica en el AndroidManifest.xml antes de compilar
          sed -i "s/MAPS_API_KEY_PLACEHOLDER/$MAPS_KEY/g" android/app/src/main/AndroidManifest.xml
          
          # Verificación opcional (solo muestra si el cambio se hizo, no muestra la key)
          if grep -q "MAPS_API_KEY_PLACEHOLDER" android/app/src/main/AndroidManifest.xml; then
            echo "Error: El placeholder no fue reemplazado."
            exit 1
          else
            echo "API Key inyectada correctamente."
          fi

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Package APK
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/ || true

      - name: Deploy Android build
        run: |
          # Clonar repo de destino usando el ACCESS_TOKEN de tus secretos
          git clone https://x-access-token:${{ secrets.ACCESS_TOKEN }}@github.com/garsau/NearMe-Android mobile-repo
          rm -rf mobile-repo/*
          cp out/app-release.apk mobile-repo/ || true
          cd mobile-repo
          
          # Configuración de bot para el commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          # Solo hacer commit si hay cambios (evita errores si el APK es igual)
          git diff-index --quiet HEAD || git commit -m "Deploy Android build: $(date +'%Y-%m-%d %H:%M')"
          git push
